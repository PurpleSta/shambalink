{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
<div class="sl-auth-wrap">
  <div class="sl-form-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to manage your listings or orders.</p>

    <form method="post">
      <div class="sl-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" required autofocus>
      </div>
      <div class="sl-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="sl-btn sl-btn-accent sl-btn-block">Log In</button>
    </form>

    <p class="sub" style="margin-top:22px;margin-bottom:0;">New to ShambaLink? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    {#
    <p class="hint" style="margin-top:14px;">Demo accounts (after seeding): farmer@example.com / buyer@example.com, password <span class="sl-mono">password123</span></p>
    #}
  </div>
</div>
{% endblock %}
